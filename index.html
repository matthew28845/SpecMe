<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'unsafe-inline'"
        http-equiv="X-Content-Security-Policy"
        content="default-src 'self'; script-src 'self'"
        />
        <title>SpecMe</title>
        <link rel="stylesheet" href=index.css>
    </head>
    <body>
         <!-- Tab links -->
        <div class="tab">
        <button class="tablinks" onclick="openTab(event, 'overviewtab')" id="defaultOpen">Overview</button>
        <button class="tablinks" onclick="openTab(event, 'cputab')">Processors</button>
        <button class="tablinks" onclick="openTab(event, 'memtab')">Memory</button>
        <button class="tablinks" onclick="openTab(event, 'storagetab')">Storage</button>
        <button class="tablinks" onclick="openTab(event, 'gpustab')">Graphics</button>
        <button class="tablinks" onclick="openTab(event, 'motherboardtab')">Motherboard</button>
        <button class="tablinks" onclick="openTab(event, 'powersupplytab')">Power</button>
        </div>

        <!-- Tab content -->
        <div id="overviewtab" class="tabcontent">
            <h3>Overview</h3>
            <div id="computermodel">
                <p id="mfg"></p>
                <p id="model"></p>
                <p id="version"></p>
            </div>
            <p id="cpu">CPU info will go here</p>
            <p id="mem">RAM will go here</p>
            <p id="disk">Disk info will go here</p>
            <p id="gpu">GPU info will go here</p>
            <p id="os">OS info will go here</p>
        </div>
        <div id="cputab" class="tabcontent">
            <h3>Processors</h3>
            <p>HERE WILL BE SHOW CPU.</p>
        </div>

        <div id="memtab" class="tabcontent">
            <h3>Memory</h3>
            <p>Paris is the capital of France.</p>
        </div>

        <div id="disktab" class="tabcontent">
            <h3>Disks</h3>
            <p>Tokyo is the capital of Japan.</p>
        <script src="./renderer.js"></script>
        <script src="./tabs.js"></script>
    </body>
</html>
